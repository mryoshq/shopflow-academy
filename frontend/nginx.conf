server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    # PWA (ADR-0024) : le service worker, le manifest et la page d'entrée doivent être
    # revalidés à chaque visite, sinon une mise à jour peut rester bloquée dans un cache
    # (navigateur ou Cloudflare) pendant des heures.
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        types { }
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }
    # ADR-0038: unhashed files of the outage page and of the theme, revalidated like the entry page.
    location ~ ^/(theme-init\.js|offline\.html|offline\.js)$ {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
