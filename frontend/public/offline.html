<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hors ligne — ShopFlow Academy</title>
  <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
  <style>
    :root { color-scheme: light dark; --bg: #FAF9F5; --card: #FFFFFF; --ink: #141413; --muted: #5E5D59; --brand: #9C4426; }
    @media (prefers-color-scheme: dark) { :root { --bg: #262624; --card: #30302E; --ink: #FAF9F5; --muted: #B7B5A9; --brand: #E0967A; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
      font-family: 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif; line-height: 1.6; }
    main { max-width: 28rem; margin: 1rem; padding: 2rem; background: var(--card); border-radius: 14px; }
    h1 { font-size: 1.5rem; margin: 0 0 .5rem; } p { color: var(--muted); }
    a { color: var(--brand); font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <h1>Vous êtes hors ligne</h1>
    <p>ShopFlow Academy a besoin d’Internet pour enregistrer vos réponses : rien n’est envoyé ni perdu tant que la connexion est coupée.</p>
    <p>Vérifiez le Wi-Fi, puis <a href="/">rechargez la page</a>.</p>
  </main>
</body>
</html>
