<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Momentanément indisponible — Rapidfox Academy</title>
  <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
  <!-- ADR-0038: served by the service worker when a page cannot be loaded and no app shell is cached.
       Self-contained (no API call except /health/live), theme of the application (theme-init.js). -->
  <script src="/theme-init.js"></script>
  <style>
    :root { color-scheme: light; --bg: #FAF9F5; --card: #FFFFFF; --border: #E6E3D9; --ink: #141413; --muted: #5E5D59; --brand: #0F5047; --solid: #146457; --ring: #1F7A6B; }
    html.dark { color-scheme: dark; --bg: #262624; --card: #30302E; --border: #45453F; --ink: #FAF9F5; --muted: #B7B5A9; --brand: #E0967A; --solid: #B5532F; --ring: #E0967A; }
    @media (prefers-color-scheme: dark) { html:not(.light) { color-scheme: dark; --bg: #262624; --card: #30302E; --border: #45453F; --ink: #FAF9F5; --muted: #B7B5A9; --brand: #E0967A; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--ink);
      font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif; line-height: 1.6; }
    main { width: 100%; max-width: 32rem; padding: 2rem; background: var(--card); border: 1px solid var(--border); border-radius: 12px;
      box-shadow: 0 1px 2px rgba(20, 20, 19, .04), 0 4px 16px rgba(20, 20, 19, .04); }
    .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 1.25rem; }
    .brand img { width: 48px; height: 48px; flex-shrink: 0; }
    .logo-dark { display: none; }
    html.dark .logo-light { display: none; } html.dark .logo-dark { display: block; }
    .school { font-weight: 700; line-height: 1.2; } .school span { color: var(--brand); }
    .module { font-size: .8rem; color: var(--muted); line-height: 1.35; margin-top: 2px; }
    h1 { font-family: 'Iowan Old Style', Charter, 'Palatino Linotype', Georgia, serif; font-size: 1.6rem; line-height: 1.2; margin: 0 0 .5rem; letter-spacing: -0.01em; }
    p { color: var(--muted); margin: 0 0 1rem; }
    .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    button { font: inherit; font-weight: 600; font-size: .9rem; color: var(--brand); background: transparent; border: 1px solid var(--border);
      border-radius: 8px; min-height: 44px; padding: 0 16px; cursor: pointer; }
    button:hover { background: color-mix(in srgb, var(--solid) 8%, transparent); }
    button:focus-visible { outline: 3px solid var(--ring); outline-offset: 2px; }
    .next { font-size: .85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>
  <main>
    <div class="brand">
      <img class="logo-light" src="/icons/logo-light.png" alt="" width="48" height="48" />
      <img class="logo-dark" src="/icons/logo-dark.png" alt="" width="48" height="48" />
      <div><div class="school">Rapidfox <span>Academy</span></div><div class="module">Python Data Engineering &amp; SQL Avancé</div></div>
    </div>
    <div role="status" aria-live="polite">
      <h1>Momentanément indisponible</h1>
      <p>La plateforme est momentanément indisponible. Votre session et votre travail sont conservés. Nouvelle tentative automatique…</p>
    </div>
    <div class="row">
      <button type="button" id="retry">Réessayer maintenant</button>
      <span class="next" id="next"></span>
    </div>
  </main>
  <script src="/offline.js"></script>
</body>
</html>
