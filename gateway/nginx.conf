server {
    listen 8080;
    server_name _;
    server_tokens off;
    client_max_body_size 1m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; media-src 'self' https://stream.nightride.fm https://radio.plaza.one; frame-src https://www.youtube-nocookie.com https://player.vimeo.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # ADR-0034: project files of the teams (20 Mo at most, checked again by the API).
    location = /api/v1/student/project/files {
        client_max_body_size 21m;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
    }
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
    }
    location /health/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
    }
    # Course videos, captions and pictures (content-addressed names only, read-only volume, ADR-0029).
    # SVG files were checked at import (no script); the strict CSP below also blocks scripts if one is opened directly.
    location ~ "^/media/[0-9a-f]{16}\.(mp4|vtt|png|jpg|webp|svg)$" {
        root /srv;
        types { video/mp4 mp4; text/vtt vtt; image/png png; image/jpeg jpg; image/webp webp; image/svg+xml svg; }
        # add_header here replaces the server-level headers: repeat the ones that matter for files.
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; frame-ancestors 'none'; sandbox" always;
        add_header Cache-Control "public, max-age=604800, immutable" always;
    }
    location /media/ {
        return 404;
    }
    location / {
        proxy_pass http://frontend:8080;
        proxy_set_header Host $host;
    }
}
