name: shopflow-academy
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
services:
  postgres:
    logging: *logging
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [private]

  migrate:
    logging: *logging
    build: ./backend
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    environment: &backend_env
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}
      APP_ENV: ${APP_ENV:-development}
      APP_BASE_URL: ${APP_BASE_URL:-http://127.0.0.1:3080}
      APP_EXTRA_ORIGINS: ${APP_EXTRA_ORIGINS:-}
      APP_SECRET: ${APP_SECRET:-}
      AI_PROVIDER: ${AI_PROVIDER:-none}
      MAIN_COURSE_SLUG: ${MAIN_COURSE_SLUG:-python-data-engineering-sql}
      CLASS_LABEL: ${CLASS_LABEL:-Classe B3 IA/Data}
      # Laboratory database (ADR-0017): read-only role for students, owner role for the dataset.
      LAB_READER_URL: postgresql://lab_reader:${LAB_READER_PASSWORD:?set LAB_READER_PASSWORD in .env (python3 scripts/init_lab_env.py)}@labdb:5432/shopflow_lab
      LAB_OWNER_URL: postgresql://lab_owner:${LAB_OWNER_PASSWORD:?set LAB_OWNER_PASSWORD in .env (python3 scripts/init_lab_env.py)}@labdb:5432/shopflow_lab
    depends_on:
      postgres:
        condition: service_healthy
    networks: [private]

  backend:
    logging: *logging
    build: ./backend
    restart: unless-stopped
    environment: *backend_env
    volumes:
      # Course videos copied at import (content-addressed); served read-only by the gateway.
      - media_data:/srv/media
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [private, lab]

  frontend:
    logging: *logging
    build: ./frontend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [private]

  gateway:
    logging: *logging
    build: ./gateway
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ACADEMY_HOST_PORT:-3080}:8080"
    volumes:
      - media_data:/srv/media:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks: [edge, private]

  backup:
    # Automatic, verified pg_dump every BACKUP_INTERVAL_HOURS into BACKUP_DIR (P0-10).
    image: postgres:16-alpine
    logging: *logging
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/ops/backup.sh"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
      BACKUP_KEEP: ${BACKUP_KEEP:-28}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-6}
    volumes:
      - ./scripts/ops/backup.sh:/ops/backup.sh:ro
      - ${BACKUP_DIR:-./.backups}:/backups
    depends_on:
      postgres:
        condition: service_healthy
    networks: [private]

  labdb:
    # Laboratory database (ADR-0017): fictional ShopFlow data only, separate network,
    # volume and credentials; no published port. Not backed up: the course dataset is
    # reloaded at each import.
    logging: *logging
    image: postgres:16-alpine
    restart: unless-stopped
    command: ["postgres", "-c", "max_connections=40", "-c", "log_min_duration_statement=-1"]
    environment:
      POSTGRES_USER: lab_admin
      POSTGRES_PASSWORD: ${LAB_POSTGRES_PASSWORD:?set LAB_POSTGRES_PASSWORD in .env (python3 scripts/init_lab_env.py)}
      POSTGRES_DB: shopflow_lab
    volumes:
      - lab_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab_admin -d shopflow_lab"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [lab]

  lab-init:
    # One shot, idempotent: lab roles (read-only lab_reader, lab_owner) and demo dataset if empty.
    logging: *logging
    build: ./backend
    command: ["python", "-m", "app.lab", "init"]
    restart: "no"
    environment:
      LAB_ADMIN_URL: postgresql://lab_admin:${LAB_POSTGRES_PASSWORD:?}@labdb:5432/shopflow_lab
      LAB_OWNER_PASSWORD: ${LAB_OWNER_PASSWORD:?}
      LAB_READER_PASSWORD: ${LAB_READER_PASSWORD:?}
      LAB_READER_URL: postgresql://lab_reader:${LAB_READER_PASSWORD:?}@labdb:5432/shopflow_lab
      LAB_OWNER_URL: postgresql://lab_owner:${LAB_OWNER_PASSWORD:?}@labdb:5432/shopflow_lab
    depends_on:
      labdb:
        condition: service_healthy
    networks: [lab]

  mysql:
    # Not used: the SQL lab is the PostgreSQL service labdb (ADR-0017). Kept for a future need.
    profiles: ["labs"]
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-shopflow}
      MYSQL_USER: ${MYSQL_USER:-shopflow_lab}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 30s
    networks: [private]

networks:
  edge:
  private:
    internal: true
  lab:
    internal: true
volumes:
  pg_data:
  mysql_data:
  media_data:
  lab_data:
