name: Academy foundation
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python -m pytest -q
        working-directory: backend
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run test -- --maxWorkers=1
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate local-only service topology
        env:
          POSTGRES_USER: academy_ci
          POSTGRES_PASSWORD: ci_placeholder_not_for_deployment
          POSTGRES_DB: academy_ci
        run: docker compose config --quiet
  studio-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Start isolated local Academy
        run: |
          python3 scripts/init_env.py
          docker compose up -d --build --wait
          python3 scripts/seed_demo.py
          docker compose exec -T backend python -m app.demo_course
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - name: Load test, 10 simultaneous demo students + teacher
        run: python3 scripts/load_test.py
      - name: Persistence after restart and container re-creation
        run: python3 scripts/persistence_check.py
      - name: Automatic backup present and tested restore
        run: python3 scripts/restore_check.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: frontend/test-results/
          if-no-files-found: ignore
