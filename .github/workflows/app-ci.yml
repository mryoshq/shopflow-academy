name: Academy foundation
# One run per change: pushes to main, and pull requests (not also the push of their branch).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# A newer commit on the same pull request cancels the run still in progress (main always runs to the end).
concurrency:
  group: app-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      # Disposable lab database for the execution and bypass tests (ADR-0017).
      labdb:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lab_admin
          POSTGRES_PASSWORD: ci_lab_admin_placeholder
          POSTGRES_DB: shopflow_lab
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lab_admin -d shopflow_lab"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      LAB_TEST_ADMIN_URL: postgresql://lab_admin:ci_lab_admin_placeholder@127.0.0.1:5432/shopflow_lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python -m pytest -q
        working-directory: backend
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify Node supports the PDF reader
        run: node -e "const [major, minor] = process.versions.node.split('.').map(Number); if (major < 22 || (major === 22 && minor < 13)) { throw new Error('Node 22.13+ required'); }"
      - run: npm ci
        working-directory: frontend
      - run: npm run test -- --maxWorkers=1
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate local-only service topology
        env:
          POSTGRES_USER: academy_ci
          POSTGRES_PASSWORD: ci_placeholder_not_for_deployment
          POSTGRES_DB: academy_ci
          LAB_POSTGRES_PASSWORD: ci_lab_admin_placeholder
          LAB_OWNER_PASSWORD: ci_lab_owner_placeholder
          LAB_READER_PASSWORD: ci_lab_reader_placeholder
        run: docker compose config --quiet
  studio-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify Node supports the PDF reader
        run: node -e "const [major, minor] = process.versions.node.split('.').map(Number); if (major < 22 || (major === 22 && minor < 13)) { throw new Error('Node 22.13+ required'); }"
      - name: Start the test stack (same procedure as on the Mac)
        run: python3 scripts/test_stack.py up
      - name: Import the Markdown demonstration course (compile, draft, publish)
        run: echo demo.enseignant | python3 scripts/course_md.py import docs/examples/demo-course --test-stack --publish
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - name: Isolated component E2E with the gateway CSP
        run: npm run test:e2e:components
        working-directory: frontend
      - name: Optional bonus blocks (isolated component fixture on 3201)
        run: npx playwright test --config playwright.bonus.config.ts
        working-directory: frontend
      - name: Rafi quiet mode and recap on an isolated browser fixture
        run: npx playwright test --config playwright.rafi-recap.config.ts
        working-directory: frontend
      - name: Load test, 10 simultaneous demo students + teacher
        run: python3 scripts/load_test.py
      - name: Persistence after restart and container re-creation
        run: python3 scripts/persistence_check.py
      - name: Automatic backup present and tested restore
        run: python3 scripts/restore_check.py --test-stack
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: frontend/test-results/
          if-no-files-found: ignore
