name: Kit integrity (pre-app)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-kit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate docs/skills (this does NOT validate the future app)
        run: python scripts/verify_kit.py
      - name: Test kit integrity
        run: python -m unittest discover -s tests -v
