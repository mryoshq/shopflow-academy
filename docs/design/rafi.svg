  <path d="M84 112 L60 120 L46 128 L76 150 L100 158 L92 136 Z" fill="#FAF4EC"/>
  <path d="M116 112 L140 120 L154 128 L124 150 L100 158 L108 136 Z" fill="#EFE2CF"/>
