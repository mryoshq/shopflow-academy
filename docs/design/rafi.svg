<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Rafi, mascotte Rapidfox Academy : tête de renard de face, en facettes, souriante (référence : docs/design/rafi-reference.jpg).
       #pupil-left / #pupil-right bougent dans leur clipPath pour suivre le curseur ; #lids-* servent au clignement ;
       #brow-left / #brow-right et #ear-left / #ear-right servent aux réactions. -->
  <!-- poitrail -->
  <path d="M58 136 L100 198 L142 136 Z" fill="#B4521F"/>
  <path d="M58 136 L100 198 L78 150 Z" fill="#8E3B1C"/>
  <path d="M82 152 L100 196 L118 152 L100 166 Z" fill="#F3E4CF"/>
  <path d="M100 166 L118 152 L100 196 Z" fill="#E6D2B8"/>
