  <path d="M22 108 L4 118 L30 120 L18 128 L46 128 L60 120 L84 112 L52 100 Z" fill="#F3E4CF"/>
  <path d="M178 108 L196 118 L170 120 L182 128 L154 128 L140 120 L116 112 L148 100 Z" fill="#E6D2B8"/>
