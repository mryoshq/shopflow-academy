  <g id="eye-left">
    <path d="M93 102 Q78 80 56 90 Q70 109 93 102 Z" fill="#F2B866"/>
    <clipPath id="clip-left"><path d="M93 102 Q78 80 56 90 Q70 109 93 102 Z"/></clipPath>
    <g clip-path="url(#clip-left)">
      <g id="pupil-left">
        <circle cx="76" cy="96" r="8.5" fill="#B5651F"/>
        <circle cx="76" cy="96" r="4.2" fill="#1F1E1D"/>
        <circle cx="78.4" cy="93.6" r="1.7" fill="#FFFFFF"/>
