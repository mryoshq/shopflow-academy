  <path d="M100 146 L100 152" stroke="#1F1E1D" stroke-width="3" stroke-linecap="round"/>
  <path d="M66 136 Q82 162 100 152 Q118 162 134 136" fill="none" stroke="#1F1E1D" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M66 136 L62 131" stroke="#1F1E1D" stroke-width="3" stroke-linecap="round"/>
