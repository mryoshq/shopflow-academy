<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Rafi, mascotte Rapidfox Academy (dessin original) : renard rapide, anguleux et sûr de lui.
       Les groupes #pupil-left / #pupil-right bougent pour suivre le curseur ; #lids-* servent au clignement. -->
  <!-- speed streaks behind the head -->
  <g stroke="#C96442" stroke-width="4" stroke-linecap="round" opacity="0.55">
    <line x1="6" y1="70" x2="34" y2="70"/>
    <line x1="2" y1="88" x2="40" y2="88"/>
    <line x1="10" y1="106" x2="32" y2="106"/>
  </g>
  <!-- ears, swept back -->
  <path d="M58 70 L30 14 L92 46 Z" fill="#9C4426"/>
  <path d="M60 62 L44 30 L80 48 Z" fill="#1F1E1D"/>
  <path d="M120 44 L132 0 L156 52 Z" fill="#9C4426"/>
  <path d="M126 44 L133 18 L148 50 Z" fill="#1F1E1D"/>
  <!-- neck and chest, sharp fur -->
  <path d="M58 132 L100 196 L150 150 L136 128 Z" fill="#B5532F"/>
  <path d="M86 150 L100 196 L116 158 L108 172 L102 150 L96 170 Z" fill="#FAF4EC"/>
  <!-- head: angular planes -->
  <path d="M40 92 L66 48 L124 40 L168 62 L196 98 L170 116 L128 138 L84 140 L52 122 Z" fill="#C96442"/>
  <path d="M124 40 L168 62 L196 98 L150 84 L118 66 Z" fill="#B5532F"/>
  <path d="M40 92 L66 48 L84 70 L60 96 Z" fill="#B5532F"/>
  <!-- cheek tufts, strong jaw -->
  <path d="M52 122 L28 128 L46 112 L34 110 L52 100 L72 120 Z" fill="#FAF4EC"/>
  <path d="M84 140 L128 138 L170 116 L150 132 L120 146 L92 148 Z" fill="#9C4426"/>
  <!-- muzzle, long and pointed -->
  <path d="M96 96 L150 84 L196 98 L170 116 L128 126 L100 118 Z" fill="#FAF4EC"/>
  <path d="M188 92 L198 98 L190 104 L182 99 Z" fill="#1F1E1D"/>
  <!-- confident smirk -->
  <path d="M140 118 L160 114 L170 108" fill="none" stroke="#1F1E1D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- eyes: narrow, hooded, focused -->
  <g id="eye-left">
    <path d="M70 84 Q84 72 100 80 Q88 94 70 84 Z" fill="#FFFFFF" stroke="#1F1E1D" stroke-width="2.5"/>
    <clipPath id="clip-left"><path d="M70 84 Q84 72 100 80 Q88 94 70 84 Z"/></clipPath>
    <g clip-path="url(#clip-left)">
      <g id="pupil-left">
        <circle cx="86" cy="83" r="6.5" fill="#E39A33"/>
        <circle cx="86" cy="83" r="3.6" fill="#1F1E1D"/>
        <circle cx="88" cy="81" r="1.4" fill="#FFFFFF"/>
      </g>
    </g>
    <path id="lids-left" d="M68 82 Q84 70 102 78" fill="none" stroke="#1F1E1D" stroke-width="4" stroke-linecap="round"/>
  </g>
  <g id="eye-right">
    <path d="M114 76 Q130 64 146 72 Q132 86 114 76 Z" fill="#FFFFFF" stroke="#1F1E1D" stroke-width="2.5"/>
    <clipPath id="clip-right"><path d="M114 76 Q130 64 146 72 Q132 86 114 76 Z"/></clipPath>
    <g clip-path="url(#clip-right)">
      <g id="pupil-right">
        <circle cx="131" cy="75" r="6.5" fill="#E39A33"/>
        <circle cx="131" cy="75" r="3.6" fill="#1F1E1D"/>
        <circle cx="133" cy="73" r="1.4" fill="#FFFFFF"/>
      </g>
    </g>
    <path id="lids-right" d="M112 74 Q130 62 148 70" fill="none" stroke="#1F1E1D" stroke-width="4" stroke-linecap="round"/>
  </g>
  <!-- low, sharp brows -->
  <path d="M66 74 L84 66 L102 70" fill="none" stroke="#1F1E1D" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M112 66 L132 56 L150 62" fill="none" stroke="#1F1E1D" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
