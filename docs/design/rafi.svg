<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Rafi, mascotte Rapidfox Academy (dessin original) : renard rapide, anguleux, souriant et sûr de lui.
       Les groupes #pupil-left / #pupil-right bougent pour suivre le curseur ; #lids-* servent au clignement. -->
  <!-- speed streaks behind the head -->
  <g stroke="#C96442" stroke-width="4" stroke-linecap="round" opacity="0.55">
    <line x1="6" y1="70" x2="34" y2="70"/>
    <line x1="2" y1="88" x2="40" y2="88"/>
    <line x1="10" y1="106" x2="32" y2="106"/>
  </g>
  <!-- ears, swept back -->
  <path d="M58 70 L30 14 L92 46 Z" fill="#9C4426"/>
  <path d="M60 62 L44 30 L80 48 Z" fill="#1F1E1D"/>
  <path d="M120 44 L132 0 L156 52 Z" fill="#9C4426"/>
  <path d="M126 44 L133 18 L148 50 Z" fill="#1F1E1D"/>
  <!-- neck and chest, sharp fur -->
  <path d="M58 132 L100 196 L150 150 L136 128 Z" fill="#B5532F"/>
  <path d="M86 150 L100 196 L116 158 L108 172 L102 150 L96 170 Z" fill="#FAF4EC"/>
  <!-- head: angular planes -->
  <path d="M40 92 L66 48 L124 40 L168 62 L196 98 L170 116 L128 138 L84 140 L52 122 Z" fill="#C96442"/>
  <path d="M124 40 L168 62 L196 98 L150 84 L118 66 Z" fill="#B5532F"/>
  <path d="M40 92 L66 48 L84 70 L60 96 Z" fill="#B5532F"/>
  <!-- cheek tufts, strong jaw -->
  <path d="M52 122 L28 128 L46 112 L34 110 L52 100 L72 120 Z" fill="#FAF4EC"/>
  <path d="M84 140 L128 138 L170 116 L150 132 L120 146 L92 148 Z" fill="#9C4426"/>
  <!-- muzzle, long and pointed -->
  <path d="M96 96 L150 84 L196 98 L170 116 L128 126 L100 118 Z" fill="#FAF4EC"/>
  <path d="M188 92 L198 98 L190 104 L182 99 Z" fill="#1F1E1D"/>
  <!-- confident smile -->
  <path d="M122 109 Q148 134 178 102 Q164 128 140 128 Q126 124 122 109 Z" fill="#1F1E1D"/>
  <path d="M130 115 Q148 125 168 112 L166 117 Q148 127 132 120 Z" fill="#FFFFFF"/>
  <path d="M178 102 L183 97" stroke="#1F1E1D" stroke-width="3" stroke-linecap="round"/>
  <!-- eyes: narrow, hooded, focused -->
  <g id="eye-left">
    <path d="M67 85 Q84 64 103 79 Q87 92 67 85 Z" fill="#FFFFFF" stroke="#1F1E1D" stroke-width="2.5"/>
    <clipPath id="clip-left"><path d="M67 85 Q84 64 103 79 Q87 92 67 85 Z"/></clipPath>
    <g clip-path="url(#clip-left)">
      <g id="pupil-left">
        <circle cx="86" cy="80" r="8" fill="#E39A33"/>
        <circle cx="86" cy="80" r="4.4" fill="#1F1E1D"/>
        <circle cx="88.5" cy="77.5" r="1.8" fill="#FFFFFF"/>
      </g>
    </g>
    <path id="lids-left" d="M65 83 Q84 63 105 77" fill="none" stroke="#1F1E1D" stroke-width="3" stroke-linecap="round"/>
  </g>
  <g id="eye-right">
    <path d="M111 77 Q130 56 149 71 Q132 84 111 77 Z" fill="#FFFFFF" stroke="#1F1E1D" stroke-width="2.5"/>
    <clipPath id="clip-right"><path d="M111 77 Q130 56 149 71 Q132 84 111 77 Z"/></clipPath>
    <g clip-path="url(#clip-right)">
      <g id="pupil-right">
        <circle cx="131" cy="71" r="8" fill="#E39A33"/>
        <circle cx="131" cy="71" r="4.4" fill="#1F1E1D"/>
        <circle cx="133.5" cy="68.5" r="1.8" fill="#FFFFFF"/>
      </g>
    </g>
    <path id="lids-right" d="M109 75 Q130 55 151 69" fill="none" stroke="#1F1E1D" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- relaxed brows -->
  <path d="M64 68 L84 60 L103 66" fill="none" stroke="#1F1E1D" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M111 61 L132 50 L152 55" fill="none" stroke="#1F1E1D" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
