    </g>
    <path d="M93 102 Q78 80 56 90 Q70 109 93 102 Z" fill="none" stroke="#1F1E1D" stroke-width="2.5" stroke-linejoin="round"/>
    <path id="lids-left" d="M95 102 Q78 78 54 89" fill="none" stroke="#1F1E1D" stroke-width="3" stroke-linecap="round"/>
  </g>
  <g id="eye-right">
    <path d="M107 102 Q122 80 144 90 Q130 109 107 102 Z" fill="#F2B866"/>
    <clipPath id="clip-right"><path d="M107 102 Q122 80 144 90 Q130 109 107 102 Z"/></clipPath>
    <g clip-path="url(#clip-right)">
      <g id="pupil-right">
        <circle cx="124" cy="96" r="8.5" fill="#B5651F"/>
        <circle cx="124" cy="96" r="4.2" fill="#1F1E1D"/>
        <circle cx="126.4" cy="93.6" r="1.7" fill="#FFFFFF"/>
      </g>
    </g>
    <path d="M107 102 Q122 80 144 90 Q130 109 107 102 Z" fill="none" stroke="#1F1E1D" stroke-width="2.5" stroke-linejoin="round"/>
    <path id="lids-right" d="M105 102 Q122 78 146 89" fill="none" stroke="#1F1E1D" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- sourcils : facettes sombres -->
  <path id="brow-left" d="M56 84 L90 88 L94 94 L74 84 Z" fill="#5A2A17"/>
  <path id="brow-right" d="M144 84 L110 88 L106 94 L126 84 Z" fill="#5A2A17"/>
</svg>
