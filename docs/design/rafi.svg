  <path d="M100 44 L126 74 L100 92 Z" fill="#DE7C30"/>
  <path d="M60 50 L34 78 L56 84 L74 74 Z" fill="#C9621F"/>
  <path d="M140 50 L166 78 L144 84 L126 74 Z" fill="#B9561D"/>
  <path d="M34 78 L22 108 L52 100 L56 84 Z" fill="#B4521F"/>
  <path d="M166 78 L178 108 L148 100 L144 84 Z" fill="#A8481F"/>
  <path d="M100 92 L90 132 L110 132 Z" fill="#F0A055"/>
  <path d="M100 92 L74 74 L84 112 L90 132 Z" fill="#E07F33"/>
  <path d="M100 92 L126 74 L116 112 L110 132 Z" fill="#CF6A27"/>
